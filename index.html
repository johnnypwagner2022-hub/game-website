:root{--bg:#04060c;--sur:#080b14;--card:#0c0f1c;--b1:#161c30;--b2:#1e2640;--ac:#3d8bff;--txt:#eaedfa;--mut:#42507a;--r:10px;--ff:'Barlow Condensed',sans-serif;--fm:'JetBrains Mono',monospace}
body{background:var(--bg);color:var(--txt);font-family:var(--ff);overflow-x:hidden;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(61,139,255,.12),transparent),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(255,100,200,.06),transparent);pointer-events:none;z-index:0}

header{position:sticky;top:0;z-index:200;background:rgba(4,6,12,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(61,139,255,.12)}
.hdr{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:16px;height:58px;padding:0 20px}
.logo{font-weight:900;font-size:22px;letter-spacing:4px;text-decoration:none;color:var(--txt);white-space:nowrap}
.logo em{font-style:normal;background:linear-gradient(90deg,#3d8bff,#00d4ff,#00ffb3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.srch{flex:1;max-width:360px;display:flex;align-items:center;border:1px solid var(--b2);border-radius:8px;overflow:hidden;background:rgba(8,11,20,.8)}
.srch:focus-within{border-color:rgba(61,139,255,.5);box-shadow:0 0 0 3px rgba(61,139,255,.08)}
.srch input{flex:1;background:transparent;border:none;outline:none;color:var(--txt);padding:9px 14px;font-family:var(--ff);font-size:15px;min-width:0}
.srch input::placeholder{color:var(--mut)}
.srch button{background:linear-gradient(135deg,#3d8bff,#00c8ff);border:none;cursor:pointer;color:#fff;font-weight:700;font-size:11px;letter-spacing:2px;padding:0 16px;height:100%;min-height:38px}
.hero{position:relative;border-bottom:1px solid rgba(255,255,255,.05);padding:40px 20px 32px;text-align:center;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 50% 120%,rgba(61,139,255,.15),transparent);pointer-events:none}
.eyebrow{position:relative;font-family:var(--fm);font-size:10px;letter-spacing:5px;color:#00d4ff;text-transform:uppercase;margin-bottom:12px}
.hero h1{position:relative;font-size:clamp(28px,7vw,62px);font-weight:900;letter-spacing:2px;text-transform:uppercase;line-height:.95;margin-bottom:8px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#3d8bff,#00d4ff,#00ffb3,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{position:relative;color:var(--mut);font-size:14px}
.hstats{position:relative;display:flex;justify-content:center;gap:40px;margin-top:20px;flex-wrap:wrap}
.hstats div{text-align:center}
.sv{font-family:var(--fm);font-size:24px;font-weight:700;display:block;background:linear-gradient(90deg,#3d8bff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sk{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--mut);margin-top:3px;display:block}
.adstrip{background:var(--sur);border-bottom:1px solid rgba(255,255,255,.04);padding:10px 0;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;position:relative;z-index:1}
.albl{font-family:var(--fm);font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase}
.page{max-width:1440px;margin:0 auto;padding:24px 20px 48px;display:grid;grid-template-columns:1fr 288px;gap:24px;align-items:start;position:relative;z-index:1}
@media(max-width:920px){.page{grid-template-columns:1fr}}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.fb{padding:6px 15px;font-family:var(--ff);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--b2);border-radius:20px;background:transparent;color:var(--mut);cursor:pointer;transition:all .18s;white-space:nowrap}
.fb:hover{color:var(--txt);border-color:rgba(255,255,255,.2)}
.fb.on[data-cat=all]{background:linear-gradient(90deg,#3d8bff,#00c8ff);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(61,139,255,.35)}
.fb.on[data-cat=action]{background:linear-gradient(90deg,#ff3838,#ff6868);border-color:transparent;color:#fff}
.fb.on[data-cat=puzzle]{background:linear-gradient(90deg,#2266ff,#5aabff);border-color:transparent;color:#fff}
.fb.on[data-cat=casual]{background:linear-gradient(90deg,#ff7700,#ffaa38);border-color:transparent;color:#fff}
.fb.on[data-cat=strategy]{background:linear-gradient(90deg,#00aabb,#3dd4d4);border-color:transparent;color:#000}
.fb.on[data-cat=sports]{background:linear-gradient(90deg,#00aa44,#22d470);border-color:transparent;color:#000}
.fb.on[data-cat=racing]{background:linear-gradient(90deg,#ddaa00,#ffd42a);border-color:transparent;color:#000}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
@media(max-width:500px){.gg{grid-template-columns:repeat(2,1fr);gap:8px}}
.gc{background:var(--card);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,border-color .2s;position:relative}

.gc:active{transform:translateY(-2px) scale(.99)}
.gthumb{aspect-ratio:8/5;overflow:hidden;position:relative}
.gthumb svg{width:100%;height:100%;display:block;transition:transform .3s}

.gfoot{display:flex;justify-content:space-between;align-items:center}
.gbadge{font-family:var(--fm);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:10px}
.gplays{font-family:var(--fm);font-size:10px;color:var(--mut)}
.sb{display:flex;flex-direction:column;gap:16px}
.spanel{background:var(--card);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden}
.spanel-head{padding:10px 14px;font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--b1);background:rgba(8,11,20,.6)}
.ti{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .15s}
.ti:last-child{border-bottom:none}
.ti:hover{background:rgba(61,139,255,.07)}
.trk{font-family:var(--fm);font-size:10px;color:var(--mut);width:16px;flex-shrink:0;font-weight:700}
.tinf{flex:1;min-width:0}
.tn{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp{font-family:var(--fm);font-size:10px;color:var(--mut);margin-top:1px}

.nores{display:none;text-align:center;color:var(--mut);padding:48px;font-family:var(--fm);font-size:13px}

.sh::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--b1),transparent)}

.mov.open{display:flex}

.mttl{font-weight:900;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}

.mframe{flex:1;position:relative;background:#000;min-height:500px}
.modal.fs .mframe{min-height:0;height:calc(100vh - 44px)}
.mframe iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:block}</style>

var activeFilter='all';
function plays(id){return(CAT[id].plays||500)+parseInt(localStorage.getItem('gz_p_'+id)||'0');}
function incPlays(id){var c=parseInt(localStorage.getItem('gz_p_'+id)||'0');localStorage.setItem('gz_p_'+id,c+1);}
function fmt(n){return n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(Math.floor(n));}
function totalPlays(){return ORDER.reduce(function(s,id){return s+(parseInt(localStorage.getItem('gz_p_'+id)||'0')+(CAT[id].plays||0));},0);}
function openGame(id){
  incPlays(id);
  var pc=document.getElementById('pc_'+id);if(pc)pc.textContent=fmt(plays(id));
  document.getElementById('mttl').textContent=CAT[id].name;
  document.getElementById('gframe').srcdoc=G[id];
  document.getElementById('modal-ov').classList.add('open');
  document.getElementById('modal-box').classList.remove('fs');
  document.getElementById('fs-btn').textContent='Fullscreen';
  document.body.style.overflow='hidden';
  buildTop();
  document.getElementById('total-plays').textContent=fmt(totalPlays());
}
function closeModal(){
  if(document.fullscreenElement||document.webkitFullscreenElement){
    try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}
  }
  document.getElementById('modal-box').classList.remove('fs');
  document.getElementById('modal-ov').classList.remove('open');
  document.getElementById('gframe').srcdoc='';
  document.body.style.overflow='';
  document.getElementById('fs-btn').textContent='Fullscreen';
}
function goFullscreen(){
  var box=document.getElementById('modal-box');
  if(document.fullscreenElement||document.webkitFullscreenElement){
    try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}
  } else {
    var fn=box.requestFullscreen||box.webkitRequestFullscreen||box.mozRequestFullScreen||box.msRequestFullscreen;
    if(fn){
      fn.call(box).catch(function(){
        box.classList.add('fs');
        document.getElementById('fs-btn').textContent='Exit Full';
      });
    } else {
      box.classList.add('fs');
      document.getElementById('fs-btn').textContent='Exit Full';
    }
  }
}
function onFSChange(){
  var el=document.fullscreenElement||document.webkitFullscreenElement;
  var box=document.getElementById('modal-box');
  if(el){box.classList.add('fs');document.getElementById('fs-btn').textContent='Exit Full';}
  else{box.classList.remove('fs');document.getElementById('fs-btn').textContent='Fullscreen';}
}
document.addEventListener('fullscreenchange',onFSChange);
document.addEventListener('webkitfullscreenchange',onFSChange);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
document.getElementById('modal-ov').addEventListener('click',function(e){if(e.target===this)closeModal();});
function setFilter(cat){
  activeFilter=cat;
  document.querySelectorAll('.fb').forEach(function(b){b.classList.toggle('on',b.dataset.cat===cat);});
  renderGrid();
}
function renderGrid(){
  var grid=document.getElementById('grid');
  var q=document.getElementById('search').value.toLowerCase().trim();
  grid.innerHTML='';var visible=0;
  ORDER.forEach(function(id){
    var info=CAT[id];
    if((activeFilter!=='all'&&info.cat!==activeFilter)||(q&&!info.name.toLowerCase().includes(q)&&!info.cat.includes(q)))return;
    visible++;
    var card=document.createElement('div');card.className='gc';card.dataset.id=id;
    card.innerHTML='<div class="gthumb" style="background:'+info.bg+'">'+THUMB[id]+'<div class="gov"><span class="govt">PLAY NOW</span></div></div>'
      +'<div class="ginfo"><div class="gname">'+info.name+'</div>'
      +'<div class="gfoot"><span class="gbadge" style="background:'+info.cbg+';color:'+info.ccol+'">'+info.cat+'</span>'
      +'<span class="gplays" id="pc_'+id+'">'+fmt(plays(id))+'</span></div></div>';
    grid.appendChild(card);
  });
  document.getElementById('nores').style.display=visible?'none':'block';
  buildTop();
}
document.getElementById('grid').addEventListener('click',function(e){
  var c=e.target.closest('.gc');if(c&&c.dataset.id)openGame(c.dataset.id);
});
function buildTop(){
  var sorted=ORDER.slice().sort(function(a,b){return plays(b)-plays(a);}).slice(0,8);
  document.getElementById('top-list').innerHTML=sorted.map(function(id,i){
    return '<div class="ti" data-id="'+id+'"><span class="trk">'+(i+1)+'</span>'
      +'<div class="tinf"><div class="tn">'+CAT[id].name+'</div>'
      +'<div class="tp">'+fmt(plays(id))+' plays</div></div></div>';
  }).join('');
}
document.getElementById('top-list').addEventListener('click',function(e){
  var ti=e.target.closest('.ti');if(ti&&ti.dataset.id)openGame(ti.dataset.id);
});
document.querySelectorAll('.fb').forEach(function(btn){
  btn.addEventListener('click',function(){setFilter(this.dataset.cat);});
});
document.getElementById('search').addEventListener('input',renderGrid);
renderGrid();
document.getElementById('total-plays').textContent=fmt(totalPlays());

try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
</script>
